#
# Eclipse JDT formatter settings used by the Spotless "eclipse" step.
#
# PURPOSE
# -------
# This is the OTP Java code style. Up to and including OTP v2.11 the code was formatted with
# Prettier (prettier-plugin-java) and this profile configured the formatting of Javadoc comments
# only - Prettier does not format the content of a Javadoc comment, it only re-indents it. The
# Prettier step for Java has been removed (it required node/npm on the PATH and was slow), so this
# profile now formats both the code and the Javadoc.
#
# The code settings are chosen to reproduce the previous Prettier output as closely as the Eclipse
# formatter allows: 100 character lines, 2 space indentation, one argument per line when a call
# does not fit, and the parentheses on their own lines when that happens. Every setting that
# affects the layout was picked by formatting the whole code base and keeping the value that
# produced the smallest diff against the Prettier formatted code.
#
# Known differences from Prettier that the Eclipse formatter cannot express:
#   - Method chains: Prettier breaks a chain based on the shape of the chain (a chain of three or
#     more calls is broken even if it fits), the Eclipse formatter only breaks it when the line is
#     too long.
#   - Prettier "hugs" a trailing lambda argument, but expands a trailing anonymous class argument;
#     the Eclipse formatter does the opposite.
#   - Prettier adds parentheses around a wrapped expression in a 'return' statement and a trailing
#     comma after the last enum constant. The Eclipse formatter never adds or removes tokens, so
#     existing ones are kept, but no new ones are added.
#   - Prettier inserts a blank line after a class declaration. The Eclipse formatter would also do
#     it for enums, records and anonymous classes, where Prettier does not, so it is turned off
#     here: existing blank lines are kept, but no new ones are inserted.
#
# The Javadoc settings mirror the IntelliJ IDEA *default* code style (Editor > Code Style > Java >
# JavaDoc), since the project does not ship a custom IntelliJ scheme.
#
# Known differences from IntelliJ for Javadoc that the Eclipse formatter cannot express:
#   - IntelliJ inserts <p> on blank Javadoc lines, the Eclipse formatter never does.
#   - The first line of a paragraph that starts with <p> ends up ~4 characters shorter than the
#     line length, because Eclipse wraps the text with the <p> included and the tag is moved to
#     its own line afterwards (see the note below).
#
# Note! Eclipse re-flows a paragraph as one unit, which moves <p>, <pre> and </pre> onto the
# neighbouring text line, and it puts all list content in the same column as the surrounding text.
# OTP keeps these tags on their own lines and indents list items, so the Spotless configuration in
# the root pom.xml has a few 'replaceRegex' steps that restore this after this formatter has run:
# list content is indented by two spaces per nesting level (up to two levels) and the continuation
# lines of a wrapped list item get four more spaces so that they line up with the item text. Since
# Eclipse wraps the text before the indentation is added, list lines can end up slightly wider than
# the line length below (a handful of lines reach ~106 characters).
#
# Note! Options that are not listed in this file fall back to the Eclipse built-in defaults.
#
# ---------------------------------------------------------------------------------------------
# Javadoc
# ---------------------------------------------------------------------------------------------
# Format Javadoc comments only. Line comments (//), block comments (/* */) and the file header are
# left untouched, mirroring IntelliJ's "Enable JavaDoc formatting" which only applies to Javadoc.
org.eclipse.jdt.core.formatter.comment.format_javadoc_comments=true
org.eclipse.jdt.core.formatter.comment.format_block_comments=false
org.eclipse.jdt.core.formatter.comment.format_line_comments=false
org.eclipse.jdt.core.formatter.comment.format_header=false
# Split lines longer than this, counted from the start of the line (not from the comment start).
# 100 matches the line length used for the code.
org.eclipse.jdt.core.formatter.comment.line_length=100
org.eclipse.jdt.core.formatter.comment.count_line_length_from_starting_position=false
# Re-flow paragraphs like IntelliJ does: lines are joined and re-split at the line length above,
# instead of only splitting lines that are too long (which leaves short leftover lines behind).
org.eclipse.jdt.core.formatter.join_lines_in_comments=true
# Recognize HTML so that the content of <pre> blocks is left alone. Code inside <pre> and
# {@code ...} is never re-formatted.
org.eclipse.jdt.core.formatter.comment.format_html=true
org.eclipse.jdt.core.formatter.comment.format_source_code=false
# IntelliJ: "Align parameter descriptions" / "Align thrown exception descriptions". The 'grouped'
# variant aligns the descriptions of consecutive tags of the same type, without padding the tag
# name itself - this is what IntelliJ does.
org.eclipse.jdt.core.formatter.comment.align_tags_descriptions_grouped=true
org.eclipse.jdt.core.formatter.comment.align_tags_names_descriptions=false
org.eclipse.jdt.core.formatter.comment.indent_parameter_description=false
org.eclipse.jdt.core.formatter.comment.indent_root_tags=false
# IntelliJ: "Blank line after description" = on, but no blank lines between the individual tags.
org.eclipse.jdt.core.formatter.comment.insert_new_line_before_root_tags=insert
org.eclipse.jdt.core.formatter.comment.insert_new_line_between_different_tags=do not insert
org.eclipse.jdt.core.formatter.comment.insert_new_line_for_parameter=do not insert
org.eclipse.jdt.core.formatter.comment.javadoc_do_not_separate_block_tags=true
# IntelliJ: "Keep empty lines" = on, and /** and */ are always placed on their own lines.
org.eclipse.jdt.core.formatter.comment.clear_blank_lines_in_javadoc_comment=false
org.eclipse.jdt.core.formatter.comment.new_lines_at_javadoc_boundaries=true
org.eclipse.jdt.core.formatter.comment.preserve_white_space_between_code_and_line_comments=true
# Respect @formatter:off / @formatter:on markers.
org.eclipse.jdt.core.formatter.use_on_off_tags=true
org.eclipse.jdt.core.formatter.disabling_tag=@formatter\:off
org.eclipse.jdt.core.formatter.enabling_tag=@formatter\:on
# ---------------------------------------------------------------------------------------------
# Indentation and line length (Prettier: printWidth=100, tabWidth=2, useTabs=false)
# ---------------------------------------------------------------------------------------------
org.eclipse.jdt.core.formatter.tabulation.char=space
org.eclipse.jdt.core.formatter.tabulation.size=2
org.eclipse.jdt.core.formatter.indentation.size=2
org.eclipse.jdt.core.formatter.use_tabs_only_for_leading_indentations=false
org.eclipse.jdt.core.formatter.lineSplit=100
# A wrapped line is indented by one indentation level (2 spaces), like Prettier. Wrapped lines are
# never aligned on the column of the opening parenthesis (see the line wrapping section below).
org.eclipse.jdt.core.formatter.continuation_indentation=1
org.eclipse.jdt.core.formatter.continuation_indentation_for_array_initializer=1
org.eclipse.jdt.core.formatter.indent_body_declarations_compare_to_type_header=true
org.eclipse.jdt.core.formatter.indent_body_declarations_compare_to_enum_declaration_header=true
org.eclipse.jdt.core.formatter.indent_body_declarations_compare_to_enum_constant_header=true
org.eclipse.jdt.core.formatter.indent_body_declarations_compare_to_record_header=true
org.eclipse.jdt.core.formatter.indent_body_declarations_compare_to_annotation_declaration_header=true
org.eclipse.jdt.core.formatter.indent_statements_compare_to_block=true
org.eclipse.jdt.core.formatter.indent_statements_compare_to_body=true
org.eclipse.jdt.core.formatter.indent_switchstatements_compare_to_cases=true
org.eclipse.jdt.core.formatter.indent_switchstatements_compare_to_switch=true
org.eclipse.jdt.core.formatter.indent_breaks_compare_to_cases=true
org.eclipse.jdt.core.formatter.indent_empty_lines=false
org.eclipse.jdt.core.formatter.align_type_members_on_columns=false
org.eclipse.jdt.core.formatter.align_variable_declarations_on_columns=false
org.eclipse.jdt.core.formatter.align_assignment_statements_on_columns=false
org.eclipse.jdt.core.formatter.align_arrows_in_switch_on_columns=false
# Prettier re-indents comments, it does not leave them in the first column.
org.eclipse.jdt.core.formatter.never_indent_block_comments_on_first_column=false
org.eclipse.jdt.core.formatter.never_indent_line_comments_on_first_column=false
# Leave the content of a text block exactly as it is written, and keep the opening """ on a line
# of its own when the enclosing expression is wrapped.
org.eclipse.jdt.core.formatter.text_block_indentation=3
org.eclipse.jdt.core.formatter.put_text_block_quotes_on_new_line=true
# ---------------------------------------------------------------------------------------------
# Blank lines - Prettier keeps the blank lines written by the author (at most one in a row) and
# does not insert new ones, so no blank lines are inserted here either.
# ---------------------------------------------------------------------------------------------
org.eclipse.jdt.core.formatter.number_of_empty_lines_to_preserve=1
org.eclipse.jdt.core.formatter.blank_lines_before_package=0
org.eclipse.jdt.core.formatter.blank_lines_after_package=1
org.eclipse.jdt.core.formatter.blank_lines_before_imports=1
org.eclipse.jdt.core.formatter.blank_lines_after_imports=1
org.eclipse.jdt.core.formatter.blank_lines_between_import_groups=0
org.eclipse.jdt.core.formatter.blank_lines_between_type_declarations=0
org.eclipse.jdt.core.formatter.blank_lines_before_first_class_body_declaration=0
org.eclipse.jdt.core.formatter.blank_lines_after_last_class_body_declaration=0
org.eclipse.jdt.core.formatter.blank_lines_before_field=0
org.eclipse.jdt.core.formatter.blank_lines_before_method=0
org.eclipse.jdt.core.formatter.blank_lines_before_abstract_method=0
org.eclipse.jdt.core.formatter.blank_lines_before_member_type=0
org.eclipse.jdt.core.formatter.blank_lines_before_new_chunk=0
org.eclipse.jdt.core.formatter.blank_lines_between_statement_group_in_switch=0
org.eclipse.jdt.core.formatter.number_of_blank_lines_at_beginning_of_method_body=0
org.eclipse.jdt.core.formatter.number_of_blank_lines_at_end_of_method_body=0
org.eclipse.jdt.core.formatter.number_of_blank_lines_at_beginning_of_code_block=0
org.eclipse.jdt.core.formatter.number_of_blank_lines_at_end_of_code_block=0
org.eclipse.jdt.core.formatter.number_of_blank_lines_before_code_block=0
org.eclipse.jdt.core.formatter.number_of_blank_lines_after_code_block=0
org.eclipse.jdt.core.formatter.insert_new_line_at_end_of_file_if_missing=insert
# ---------------------------------------------------------------------------------------------
# Braces - always at the end of the line, an empty body collapses to {}
# ---------------------------------------------------------------------------------------------
org.eclipse.jdt.core.formatter.brace_position_for_type_declaration=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_anonymous_type_declaration=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_annotation_type_declaration=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_enum_declaration=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_enum_constant=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_record_declaration=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_record_constructor=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_constructor_declaration=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_method_declaration=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_lambda_body=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_block=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_block_in_case=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_block_in_case_after_arrow=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_switch=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_array_initializer=end_of_line
org.eclipse.jdt.core.formatter.insert_new_line_in_empty_type_declaration=do not insert
org.eclipse.jdt.core.formatter.insert_new_line_in_empty_anonymous_type_declaration=do not insert
org.eclipse.jdt.core.formatter.insert_new_line_in_empty_annotation_declaration=do not insert
org.eclipse.jdt.core.formatter.insert_new_line_in_empty_enum_declaration=do not insert
org.eclipse.jdt.core.formatter.insert_new_line_in_empty_enum_constant=do not insert
org.eclipse.jdt.core.formatter.insert_new_line_in_empty_method_body=do not insert
org.eclipse.jdt.core.formatter.insert_new_line_in_empty_block=do not insert
org.eclipse.jdt.core.formatter.insert_new_line_before_else_in_if_statement=do not insert
org.eclipse.jdt.core.formatter.insert_new_line_before_catch_in_try_statement=do not insert
org.eclipse.jdt.core.formatter.insert_new_line_before_finally_in_try_statement=do not insert
org.eclipse.jdt.core.formatter.insert_new_line_before_while_in_do_statement=do not insert
org.eclipse.jdt.core.formatter.insert_new_line_after_label=do not insert
# ---------------------------------------------------------------------------------------------
# Statements on one line - Prettier always puts the body of a control statement on its own line,
# only an empty body is kept on one line.
# ---------------------------------------------------------------------------------------------
org.eclipse.jdt.core.formatter.keep_type_declaration_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_anonymous_type_declaration_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_annotation_declaration_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_enum_declaration_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_enum_constant_declaration_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_record_declaration_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_record_constructor_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_method_body_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_lambda_body_block_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_code_block_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_if_then_body_block_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_loop_body_block_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_switch_body_block_on_one_line=one_line_if_empty
org.eclipse.jdt.core.formatter.keep_switch_case_with_arrow_on_one_line=one_line_if_single_item
org.eclipse.jdt.core.formatter.keep_simple_getter_setter_on_one_line=false
org.eclipse.jdt.core.formatter.keep_then_statement_on_same_line=false
org.eclipse.jdt.core.formatter.keep_else_statement_on_same_line=false
org.eclipse.jdt.core.formatter.keep_simple_while_body_on_same_line=false
org.eclipse.jdt.core.formatter.keep_simple_for_body_on_same_line=false
org.eclipse.jdt.core.formatter.keep_simple_do_while_body_on_same_line=false
org.eclipse.jdt.core.formatter.keep_empty_array_initializer_on_one_line=true
org.eclipse.jdt.core.formatter.format_guardian_clause_on_one_line=false
org.eclipse.jdt.core.formatter.compact_else_if=true
# ---------------------------------------------------------------------------------------------
# Line wrapping
#
# The alignment values are Eclipse bit masks: 0 = never wrap here, 16 = wrap where necessary,
# 48 = wrap all elements (each on its own line) when the line is too long, 49 = the same, but
# always (forced), 84 = wrap all elements except the first one, indented by one level. None of
# them set the "indent on column" bit, so wrapped lines are indented by one level, like Prettier.
# ---------------------------------------------------------------------------------------------
# Arguments and parameters: all on separate lines when the call/declaration does not fit, with the
# parentheses on their own lines - this is Prettier's "expanded" form.
org.eclipse.jdt.core.formatter.alignment_for_parameters_in_method_declaration=48
org.eclipse.jdt.core.formatter.alignment_for_parameters_in_constructor_declaration=48
org.eclipse.jdt.core.formatter.alignment_for_record_components=48
org.eclipse.jdt.core.formatter.alignment_for_arguments_in_method_invocation=48
org.eclipse.jdt.core.formatter.alignment_for_arguments_in_allocation_expression=48
org.eclipse.jdt.core.formatter.alignment_for_arguments_in_qualified_allocation_expression=48
org.eclipse.jdt.core.formatter.alignment_for_arguments_in_explicit_constructor_call=48
org.eclipse.jdt.core.formatter.alignment_for_arguments_in_enum_constant=48
org.eclipse.jdt.core.formatter.alignment_for_arguments_in_annotation=48
org.eclipse.jdt.core.formatter.alignment_for_expressions_in_array_initializer=48
org.eclipse.jdt.core.formatter.alignment_for_enum_constants=49
org.eclipse.jdt.core.formatter.alignment_for_resources_in_try=48
org.eclipse.jdt.core.formatter.alignment_for_expressions_in_for_loop_header=48
org.eclipse.jdt.core.formatter.alignment_for_assertion_message=16
org.eclipse.jdt.core.formatter.parentheses_positions_in_method_delcaration=separate_lines_if_wrapped
org.eclipse.jdt.core.formatter.parentheses_positions_in_method_invocation=separate_lines_if_wrapped
org.eclipse.jdt.core.formatter.parentheses_positions_in_enum_constant_declaration=separate_lines_if_wrapped
org.eclipse.jdt.core.formatter.parentheses_positions_in_record_declaration=separate_lines_if_wrapped
org.eclipse.jdt.core.formatter.parentheses_positions_in_annotation=separate_lines_if_wrapped
org.eclipse.jdt.core.formatter.parentheses_positions_in_if_while_statement=separate_lines_if_wrapped
org.eclipse.jdt.core.formatter.parentheses_positions_in_for_statment=separate_lines_if_wrapped
org.eclipse.jdt.core.formatter.parentheses_positions_in_switch_statement=separate_lines_if_wrapped
org.eclipse.jdt.core.formatter.parentheses_positions_in_try_clause=separate_lines_if_wrapped
org.eclipse.jdt.core.formatter.parentheses_positions_in_catch_clause=separate_lines_if_wrapped
org.eclipse.jdt.core.formatter.parentheses_positions_in_lambda_declaration=common_lines
# Method chains: keep the first call on the line with the expression it is invoked on (Prettier
# does this for factory methods), the rest go one per line.
org.eclipse.jdt.core.formatter.alignment_for_selector_in_method_invocation=84
# Do not re-wrap the enclosing expression when a nested expression is wrapped - without this the
# formatter breaks up calls that Prettier keeps on one line.
org.eclipse.jdt.core.formatter.wrap_outer_expressions_when_nested=false
# Binary expressions break after the operator ('a &&', 'a +'), conditional expressions break
# before the '?' and the ':' - both like Prettier. All the operands are wrapped, not only the ones
# that do not fit.
org.eclipse.jdt.core.formatter.alignment_for_binary_expression=48
org.eclipse.jdt.core.formatter.alignment_for_logical_operator=48
org.eclipse.jdt.core.formatter.alignment_for_relational_operator=48
org.eclipse.jdt.core.formatter.alignment_for_bitwise_operator=48
org.eclipse.jdt.core.formatter.alignment_for_additive_operator=48
org.eclipse.jdt.core.formatter.alignment_for_multiplicative_operator=48
org.eclipse.jdt.core.formatter.alignment_for_shift_operator=48
org.eclipse.jdt.core.formatter.alignment_for_string_concatenation=48
org.eclipse.jdt.core.formatter.alignment_for_conditional_expression=48
org.eclipse.jdt.core.formatter.alignment_for_conditional_expression_chain=48
org.eclipse.jdt.core.formatter.wrap_before_binary_operator=false
org.eclipse.jdt.core.formatter.wrap_before_logical_operator=false
org.eclipse.jdt.core.formatter.wrap_before_relational_operator=false
org.eclipse.jdt.core.formatter.wrap_before_bitwise_operator=false
org.eclipse.jdt.core.formatter.wrap_before_additive_operator=false
org.eclipse.jdt.core.formatter.wrap_before_multiplicative_operator=false
org.eclipse.jdt.core.formatter.wrap_before_shift_operator=false
org.eclipse.jdt.core.formatter.wrap_before_string_concatenation=false
org.eclipse.jdt.core.formatter.wrap_before_conditional_operator=true
org.eclipse.jdt.core.formatter.wrap_before_assignment_operator=false
org.eclipse.jdt.core.formatter.wrap_before_assertion_message_operator=true
org.eclipse.jdt.core.formatter.wrap_before_or_operator_multicatch=true
org.eclipse.jdt.core.formatter.wrap_before_switch_case_arrow_operator=false
org.eclipse.jdt.core.formatter.alignment_for_assignment=16
org.eclipse.jdt.core.formatter.alignment_for_multiple_fields=16
# Type declarations: 'extends', 'implements' and 'throws' go on their own lines when they do not
# fit. Type parameters and type arguments are never wrapped - Eclipse would otherwise break the
# line inside the '<...>'.
org.eclipse.jdt.core.formatter.alignment_for_superclass_in_type_declaration=48
org.eclipse.jdt.core.formatter.alignment_for_superinterfaces_in_type_declaration=16
org.eclipse.jdt.core.formatter.alignment_for_superinterfaces_in_enum_declaration=16
org.eclipse.jdt.core.formatter.alignment_for_superinterfaces_in_record_declaration=16
org.eclipse.jdt.core.formatter.alignment_for_permitted_types_in_type_declaration=16
org.eclipse.jdt.core.formatter.alignment_for_throws_clause_in_method_declaration=48
org.eclipse.jdt.core.formatter.alignment_for_throws_clause_in_constructor_declaration=48
org.eclipse.jdt.core.formatter.alignment_for_method_declaration=0
org.eclipse.jdt.core.formatter.alignment_for_type_parameters=0
org.eclipse.jdt.core.formatter.alignment_for_type_arguments=0
org.eclipse.jdt.core.formatter.alignment_for_parameterized_type_references=0
org.eclipse.jdt.core.formatter.alignment_for_union_type_in_multicatch=16
org.eclipse.jdt.core.formatter.alignment_for_module_statements=16
# Never join an 'if'/loop and its statement, and never join a switch case and its expression.
org.eclipse.jdt.core.formatter.alignment_for_compact_if=16
org.eclipse.jdt.core.formatter.alignment_for_compact_loops=16
org.eclipse.jdt.core.formatter.alignment_for_switch_case_with_arrow=16
org.eclipse.jdt.core.formatter.alignment_for_expressions_in_switch_case_with_arrow=48
org.eclipse.jdt.core.formatter.alignment_for_expressions_in_switch_case_with_colon=48
# Re-wrap everything from scratch, ignoring the line breaks in the source file.
org.eclipse.jdt.core.formatter.join_wrapped_lines=true
# ---------------------------------------------------------------------------------------------
# Annotations - on their own line for types, methods, fields and packages, inline for parameters
# and local variables.
# ---------------------------------------------------------------------------------------------
org.eclipse.jdt.core.formatter.insert_new_line_after_annotation_on_type=insert
org.eclipse.jdt.core.formatter.insert_new_line_after_annotation_on_member=insert
org.eclipse.jdt.core.formatter.insert_new_line_after_annotation_on_method=insert
org.eclipse.jdt.core.formatter.insert_new_line_after_annotation_on_field=insert
org.eclipse.jdt.core.formatter.insert_new_line_after_annotation_on_enum_constant=insert
org.eclipse.jdt.core.formatter.insert_new_line_after_annotation_on_package=insert
org.eclipse.jdt.core.formatter.insert_new_line_after_annotation_on_parameter=do not insert
org.eclipse.jdt.core.formatter.insert_new_line_after_annotation_on_local_variable=do not insert
org.eclipse.jdt.core.formatter.insert_new_line_after_type_annotation=do not insert
org.eclipse.jdt.core.formatter.alignment_for_annotations_on_type=49
org.eclipse.jdt.core.formatter.alignment_for_annotations_on_method=49
org.eclipse.jdt.core.formatter.alignment_for_annotations_on_field=49
org.eclipse.jdt.core.formatter.alignment_for_annotations_on_enum_constant=49
org.eclipse.jdt.core.formatter.alignment_for_annotations_on_package=49
org.eclipse.jdt.core.formatter.alignment_for_annotations_on_parameter=0
org.eclipse.jdt.core.formatter.alignment_for_annotations_on_local_variable=16
org.eclipse.jdt.core.formatter.alignment_for_type_annotations=0
